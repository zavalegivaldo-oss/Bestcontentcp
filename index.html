<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Moose VPN - Atualização</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
  body {
    background: linear-gradient(to bottom, #8B0000 0%, #000 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 400px;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 15px;
    font-weight: bold;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #ccc;
    margin-bottom: 30px;
  }
  .btn-atualizar {
    width: 100%;
    padding: 16px;
    background: #E60000;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-atualizar:hover {
    background: #cc0000;
    transform: scale(1.02);
  }
  .btn-atualizar:disabled {
    background: #555;
    color: #999;
    cursor: not-allowed;
  }
  .aviso {
    margin-top: 20px;
    font-size: 14px;
    color: #00ff64;
    font-weight: bold;
    display: none;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Estamos em atualização</h1>
    <p>
      Por favor, aguarde.<br>
      Aguarde a renovação do<br>
      <strong>My Muze VPN</strong>
    </p>

    <button class="btn-atualizar" id="btn">Atualizar</button>
    
    <div class="aviso" id="aviso">Aguarde 24 horas pela atualização</div>
  </div>

<script>
  const btn = document.getElementById('btn');
  const aviso = document.getElementById('aviso');

  btn.addEventListener('click', () => {
    btn.disabled = true;
    btn.innerText = "Aguarde...";
    aviso.style.display = "block";
    
    // Esconde o botão depois de clicar
    setTimeout(() => {
      btn.style.display = "none";
    }, 2000);
  });
</script>
</body>
</html>
